# Deploy local do Decidim (GovBR) usando apenas Docker Compose — sem
# Kubernetes, Skaffold ou Helm.
#
# Uso (a partir da raiz do repositório):
#   docker compose up --build
#   # http://localhost:3000
#
# No primeiro boot o banco é criado, migrado e populado com os seeds do
# Decidim (SEED=1) — pode levar alguns minutos. Usuário admin seedado:
#   admin@example.org / decidim123456789
#
# Para apagar tudo incluindo dados:
#   docker compose down -v

name: decidim-local

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Ambiente development: inclui todas as gems (decidim-dev/faker,
        # exigidas no boot) e pula a pré-compilação de assets.
        ENVIRONMENT: development
    image: decidim-govbr:local
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      RAILS_ENV: development
      RAILS_LOG_TO_STDOUT: "true"
      RAILS_MAX_THREADS: "3"
      WEB_CONCURRENCY: "1"
      PORT: "3000"
      # Seeds do Decidim no primeiro boot (banco novo).
      SEED: "1"
      # Apenas para uso local.
      SECRET_KEY_BASE: "a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f90"
      # Em development o database.yml lê DATABASE_HOST/USERNAME/PASSWORD.
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      DATABASE_USERNAME: decidim
      DATABASE_PASSWORD: decidim
      REDIS_URL: "redis://redis:6379/0"
      # O decidim-ai usa URLs próprias de Redis para o spam detection
      # (o default é localhost, que não existe dentro do container).
      DECIDIM_SPAM_DETECTION_BACKEND_RESOURCE_URL: "redis://redis:6379/2"
      DECIDIM_SPAM_DETECTION_BACKEND_USER_REDIS_URL: "redis://redis:6379/3"
      STORAGE_PROVIDER: local
    ports:
      - "3000:3000"
    volumes:
      - uploads:/decidim/spec/decidim_dummy_app/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/up"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 180s
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: decidim
      POSTGRES_PASSWORD: decidim
      # Nome precisa bater com o database.yml do dummy app (development),
      # senão o healthcheck passa antes do Rails criar o banco real.
      POSTGRES_DB: decidim_test_app_development
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U decidim -d decidim_test_app_development"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    ports:
      - "6379:6379"
    image: redis:7-alpine

volumes:
  pgdata:
  uploads:
