##
# Reusable Decidim module CI (aligned with spam_signal / toggle patterns).
# Local CI parity: docker compose -f docker-compose.ci.yml run --rm rspec
# (see bin/ci-setup). Full stack adds docs build, GitLab Pages (docs site publish), and gem publish.
# Required CI/CD variables for publish:
# - GEM_HOST_API_KEY (protected & masked)
##
stages:
  - lint
  - test
  - publish

variables:
  POSTGRES_DB: decidim_test
  POSTGRES_USER: decidim
  POSTGRES_PASSWORD: "TEST-insecure_password"

services:
  - postgres:17
  - redis:latest

.development_rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: always
    - if: '$CI_COMMIT_TAG'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always

.publication_rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: always
    - if: '$CI_COMMIT_TAG'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual

ruby::rubocop:
  extends: .development_rules
  image: ruby:3.2.2
  stage: lint
  script:
    - bundle
    - bundle exec rubocop .

node::docs:
  extends: .development_rules
  image: node:20
  stage: lint
  script:
    - cd website
    - yarn install
    - yarn build

node::pages:
  extends: .publication_rules
  image: node:20
  stage: publish
  script:
    - cd website
    - yarn install
    - yarn build
    - mv ./build ../public/
  pages: true

ruby::rubygem:
  image: ruby:3.2.2
  stage: publish
  script:
    - echo "---" > .credentials
    - |
      echo ":ci_rubygems_api_key: $GEM_HOST_API_KEY" >> .credentials
    - chmod 0600 .credentials
    - gem build decidim*.gemspec
    - gem push decidim*.gem -k ci_rubygems_api_key --config-file .credentials
  only:
    - tags

ruby::rspec:
  image: ruby:3.2.2
  stage: test
  extends: .development_rules
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/coverage.xml
  variables:
    DATABASE_HOST: "postgres"
    DATABASE_PASSWORD: "TEST-insecure_password"
    DATABASE_USERNAME: "decidim"
    DISABLED_DOCKER_COMPOSE: "true"
    DISABLE_SPRING: "1"
    TRAEFIK_REDIS_URL: "redis://localhost:6379/1"
    NODE_MAJOR: 18
    SIMPLECOV: 1
    CI: 1
  before_script:
    # System specs need Chromium/Chrome + matching chromedriver; plain ruby:* images omit the browser.
    # ruby-vips (Active Storage / Decidim) needs libvips; plain ruby:* images omit it.
    - apt-get update -qq && apt-get install -y ca-certificates curl gnupg wget libvips42
    - wget -q -O /tmp/google-chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
    - apt-get install -y /tmp/google-chrome.deb || (apt-get -f install -y && apt-get install -y /tmp/google-chrome.deb)
    - rm -f /tmp/google-chrome.deb
    - mkdir -p /etc/apt/keyrings
    - curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key | gpg --dearmor -o /etc/apt/keyrings/nodesource.gpg
    - echo "deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_$NODE_MAJOR.x nodistro main" | tee /etc/apt/sources.list.d/nodesource.list
    - apt-get update && apt-get install -y -qq nodejs
    - npm install -g yarn --force
    - gem install bundler
    - bundle config set path 'vendor'
    - RAILS_ENV=development bundle install -j $(nproc)
    - bundle exec rake test_app
  script:
    - unset DATABASE_URL && RAILS_ENV=test bundle exec rspec
