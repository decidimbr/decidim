# Be sure to restart your server when you modify this file.

decidim_default: &decidim_default
  application_name: "Extra Blocks Test"
  mailer_sender: "change-me@example.org"
  available_locales: ["en", "ca", "es", "pt-BR"]
  default_locale: en
  # Must be "auto" or blank — string "false" is .present? and enables force_ssl.
  force_ssl: "auto"
  enable_html_header_snippets: "false"
  currency_unit: "€"
  cors_enabled: "false"
  image_uploader_quality: 80
  maximum_attachment_size: 10
  maximum_avatar_size: 5
  max_reports_before_hiding: 3
  track_newsletter_links: "true"
  download_your_data_expiry_time: 7
  throttling_max_requests: 100
  throttling_period: 1
  unconfirmed_access_for: 0
  system_accesslist_ips: []
  base_uploads_path:
  default_csv_col_sep: ";"
  consent_cookie_name: "decidim-consent"
  cache_key_separator: "/"
  cache_expiry_time: 1440
  stats_cache_expiry_time: 10
  expire_session_after: 30
  session_timeout_interval: 10
  enable_remember_me: "true"
  follow_http_x_forwarded_host: "false"
  maximum_conversation_message_length: 1000
  password_similarity_length: 4
  denied_passwords: []
  allow_open_redirects: "false"
  social_share_services: ["X", "Facebook", "WhatsApp", "Telegram"]
  service_worker_enabled: "false"
  page_blocks: ["terms-of-service"]
  admin_password:
    expiration_days: 90
    min_length: 15
    repetition_times: 5
    strong: "true"
  api:
    schema_max_per_page: 50
    schema_max_complexity: 5000
    schema_max_depth: 15
  proposals:
    participatory_space_highlighted_proposals_limit: 4
    process_group_highlighted_proposals_limit: 3
  meetings:
    upcoming_meeting_notification: 2
    enable_proposal_linking: "true"
    embeddable_services: []
  budgets:
    enable_proposal_linking: "true"
  accountability:
    enable_proposal_linking: "true"
  initiatives:
    creation_enabled: "true"
    minimum_committee_members: 2
    default_signature_time_period_length: 120
    default_components: ["pages", "meetings"]
    first_notification_percentage: 33
    second_notification_percentage: 66
    stats_cache_expiration_time: 5
    max_time_in_validating_state: 60
    print_enabled: "true"
    do_not_require_authorization: "false"
  verifications:
    document_types: ["identification_number", "passport"]

storage_default: &storage_default
  provider: "local"

default: &default
  secret_key_base: "6a8af371b2b759541f253fd351431319d1c6d6ee8073419b911737e820a54cd7d6f00ac4e40c6dc107b3ee70d312dfe0ff236e49f9d95cfb10df2f8746b25712"
  decidim:
    <<: *decidim_default
  omniauth:
    facebook:
      enabled: "false"
    twitter:
      enabled: "false"
    google_oauth2:
      enabled: "false"
  maps:
    dynamic_provider: ""
    static_provider: ""
  storage:
    <<: *storage_default
  vapid:
    enabled: "false"

development:
  <<: *default

test:
  <<: *default
  omniauth:
    facebook:
      enabled: true
      app_id: fake-facebook-app-id
      app_secret: fake-facebook-app-secret
    twitter:
      enabled: true
      api_key: fake-twitter-api-key
      api_secret: fake-twitter-api-secret
    google_oauth2:
      enabled: true
      client_id:
      client_secret:
    test:
      enabled: true
      icon: tools-line

production:
  <<: *default
